[project]
name = "migration-tools"
version = "0.1.0"
description = "MCP server providing deterministic migration recommendation tools backed by a structured knowledge store."
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0.0",
    "fastmcp>=0.1.0",
]

[project.scripts]
serve = "migration_tools.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
