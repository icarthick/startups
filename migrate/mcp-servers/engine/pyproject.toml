[project]
name = "engine-mcp"
version = "0.1.0"
description = "MCP server for migration — phase orchestration, discovery, design"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0"]

[project.scripts]
engine-server = "engine.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/engine"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "engine/knowledge"

[tool.pytest.ini_options]
asyncio_mode = "strict"
