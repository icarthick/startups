[project]
name = "orchestrator-mcp"
version = "0.1.0"
description = "MCP server for migration orchestration — phase routing, state management, discovery"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0"]

[project.scripts]
orchestrator-server = "orchestrator.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orchestrator"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "orchestrator/knowledge"

[tool.pytest.ini_options]
asyncio_mode = "strict"
