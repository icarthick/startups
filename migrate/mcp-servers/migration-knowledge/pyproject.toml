[project]
name = "migration-knowledge-mcp"
version = "0.1.0"
description = "MCP server for AWS migration recommendations — compute, database, networking, messaging"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0"]

[project.scripts]
migration-knowledge-server = "migration_knowledge.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_knowledge"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "migration_knowledge/knowledge"
