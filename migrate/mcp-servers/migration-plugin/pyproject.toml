[project]
name = "migration-plugin-mcp"
version = "0.1.0"
description = "MCP server for migration orchestration — phase routing, Terraform discovery, clustering"
requires-python = ">=3.11"
dependencies = ["fastmcp>=2.0.0"]

[project.scripts]
migration-plugin-server = "migration_orchestrator.server:mcp.run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/migration_orchestrator"]

[tool.hatch.build.targets.wheel.force-include]
"knowledge" = "migration_orchestrator/knowledge"
